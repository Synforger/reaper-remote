<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>REAPER remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="row transport">
    <button id="btn-start" title="Go to start" aria-label="Go to start">⏮</button>
    <button id="btn-play" title="Play / pause" aria-label="Play / pause">▶</button>
    <button id="btn-stop" title="Stop" aria-label="Stop">■</button>
    <button id="btn-repeat" class="toggle" title="Repeat" aria-label="Repeat">⟲</button>
    <span id="position" class="position">--</span>
  </section>

  <section class="row controls">
    <button id="btn-listen" class="toggle icon" data-state="off" title="Listen: off" aria-label="Listen">🎧</button>
    <audio id="audio" preload="none"></audio>
    <div class="segmented" id="devices" hidden title="Mac output"></div>
    <button id="btn-render" class="icon" hidden title="Render the time selection" aria-label="Render">⤓</button>
  </section>

  <section class="tracks" id="tracks"></section>

  <audio id="render-audio" controls hidden></audio>

  <p id="error" class="error" hidden></p>

  <script type="module" src="app.js"></script>
</body>
</html>
