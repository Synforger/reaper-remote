<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>REAPER remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="row transport">
    <button id="btn-start" title="Go to start" aria-label="Go to start">⏮</button>
    <button id="btn-play" title="Play / pause" aria-label="Play / pause">▶</button>
    <button id="btn-stop" title="Stop" aria-label="Stop">■</button>
    <button id="btn-repeat" class="toggle" title="Repeat" aria-label="Repeat">⟲</button>
    <span id="position" class="position">--</span>
  </section>

  <section class="row listen">
    <button id="btn-listen" class="toggle wide">🎧 Listen</button>
    <span id="listen-status" class="muted">off</span>
    <audio id="audio" preload="none"></audio>
  </section>

  <section class="row output" id="output" hidden>
    <span class="label">Mac output</span>
    <div class="segmented" id="devices"></div>
  </section>

  <section class="tracks" id="tracks"></section>

  <section class="row render" id="render" hidden>
    <button id="btn-render" class="wide">Render selection</button>
    <span id="render-status" class="muted"></span>
  </section>
  <audio id="render-audio" controls hidden></audio>

  <p id="error" class="error" hidden></p>

  <script type="module" src="app.js"></script>
</body>
</html>
