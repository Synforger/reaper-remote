<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>REAPER remote</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section class="row transport">
    <button id="btn-start" title="Go to start" aria-label="Go to start" data-icon="start"></button>
    <button id="btn-prev-measure" title="Previous measure" aria-label="Previous measure" data-icon="prevMeasure" hidden></button>
    <button id="btn-play" title="Play / pause" aria-label="Play / pause" data-icon="play"></button>
    <button id="btn-next-measure" title="Next measure" aria-label="Next measure" data-icon="nextMeasure" hidden></button>
    <button id="btn-stop" title="Stop" aria-label="Stop" data-icon="stop"></button>
    <button id="btn-repeat" class="toggle" title="Repeat" aria-label="Repeat" data-icon="repeat"></button>
    <span class="where">
      <span id="section" class="section"></span>
      <span id="position" class="position">--</span>
    </span>
  </section>

  <section class="row seek" id="seek" hidden>
    <div id="timeline" class="timeline" role="slider" aria-label="Position in measures">
      <div id="regions" class="regions"></div>
      <div id="ruler" class="ruler"></div>
      <div id="loop" class="loop" hidden></div>
      <div id="range" class="range" hidden></div>
      <div id="cue" class="cue" hidden></div>
      <div id="playhead" class="playhead"></div>
      <div id="bubble" class="bubble" hidden></div>
    </div>
  </section>

  <section class="row controls">
    <span id="listen-dot" class="dot" data-state="off" role="status" title="Phone audio: off"></span>
    <audio id="audio" preload="none"></audio>
    <div class="segmented" id="devices" hidden title="Mac output"></div>
    <button id="btn-background" class="toggle bg" title="Keep playing in the background" aria-label="Keep playing in the background" aria-pressed="false">BG</button>
    <button id="btn-render" class="icon" hidden title="Render the time selection" aria-label="Render" data-icon="render"></button>
  </section>

  <section class="tracks" id="tracks"></section>

  <audio id="render-audio" controls hidden></audio>

  <p id="error" class="error" hidden></p>

  <script type="module" src="app.js"></script>
</body>
</html>
